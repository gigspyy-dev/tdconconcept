<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thrudark — Customer Experience</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #222222;
      --border: #2e2e2e;
      --accent: #4a5e3a;
      --accent-light: #5c7548;
      --white: #f0f0f0;
      --muted: #888;
      --amber: #f0a500;
      --red: #c0392b;
      --red-light: #e74c3c;
      --green: #27ae60;
      --blue: #2980b9;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--font);
      font-size: 14px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Nav ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-brand {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .nav-brand .logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--white);
    }

    .nav-brand .subtitle {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--accent-light);
    }

    .nav-divider {
      width: 1px;
      height: 32px;
      background: var(--border);
    }

    .stats-bar {
      display: flex;
      gap: 20px;
      flex: 1;
    }

    .stat-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 12px;
    }

    .stat-pill .label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .stat-pill .value {
      font-size: 16px;
      font-weight: 700;
    }

    .stat-pill.urgent .value { color: var(--amber); }
    .stat-pill.escalations .value { color: var(--red-light); }

    /* ── Layout ── */
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      height: calc(100vh - 56px);
    }

    /* ── Sidebar ── */
    aside {
      width: 220px;
      min-width: 220px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 20px 16px;
      overflow-y: auto;
    }

    .filter-section {
      margin-bottom: 24px;
    }

    .filter-section h3 {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .filter-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      color: var(--white);
      padding: 7px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
      margin-bottom: 2px;
      transition: background 0.15s;
    }

    .filter-btn:hover { background: var(--surface2); }
    .filter-btn.active { background: var(--accent); font-weight: 600; }

    .process-all-btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s;
    }

    .process-all-btn:hover { background: var(--accent-light); }
    .process-all-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Main ── */
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Ticket List ── */
    .ticket-list-panel {
      width: 360px;
      min-width: 300px;
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .list-header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    .list-header h2 {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .ticket-count {
      font-size: 12px;
      color: var(--muted);
    }

    .ticket-card {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.12s;
      position: relative;
    }

    .ticket-card:hover { background: var(--surface); }
    .ticket-card.selected { background: var(--surface2); border-left: 3px solid var(--accent); }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
    }

    .card-customer {
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-badges {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
      align-items: center;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge.priority-low { background: #2d3a2d; color: #7ec87e; }
    .badge.priority-medium { background: #2d2d1a; color: #d4c46e; }
    .badge.priority-high { background: #3a2d1a; color: #e8a44a; }
    .badge.priority-urgent { background: #3a1a1a; color: var(--amber); border: 1px solid var(--amber); }

    .badge.status-open { background: #1a2a3a; color: #6ab0e8; }
    .badge.status-in_progress { background: #2a2d1a; color: #c8d46e; }
    .badge.status-resolved { background: #1a3a2a; color: #6ec89e; }

    .badge.category { background: var(--surface2); color: var(--muted); font-size: 9px; }

    .escalation-icon { color: var(--red-light); font-size: 14px; }

    .card-subject {
      font-size: 12px;
      color: var(--white);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 6px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 11px;
      color: var(--muted);
    }

    .channel-icon { font-size: 12px; }

    /* ── Ticket Detail ── */
    .ticket-detail-panel {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      color: var(--muted);
    }

    .empty-state .icon { font-size: 48px; opacity: 0.3; }

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .detail-title {
      flex: 1;
    }

    .detail-title h2 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .detail-meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .card-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .card-section h3 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .customer-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .info-field label {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .info-field span {
      font-size: 13px;
    }

    .ticket-body-text {
      font-size: 13px;
      line-height: 1.6;
      color: #ccc;
      white-space: pre-wrap;
    }

    .escalation-banner {
      background: rgba(192, 57, 43, 0.15);
      border: 1px solid var(--red);
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .escalation-banner .icon { font-size: 18px; flex-shrink: 0; }
    .escalation-banner strong { color: var(--red-light); }
    .escalation-banner p { font-size: 13px; color: #e0a0a0; margin-top: 4px; }

    .ai-btn {
      padding: 10px 20px;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      color: white;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.15s;
    }

    .ai-btn:hover { background: var(--accent-light); }
    .ai-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    textarea.draft-reply {
      width: 100%;
      min-height: 160px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--white);
      font-family: var(--font);
      font-size: 13px;
      line-height: 1.6;
      padding: 12px;
      resize: vertical;
    }

    textarea.draft-reply:focus {
      outline: none;
      border-color: var(--accent);
    }

    .actions-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    select.status-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--white);
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
    }

    select.status-select:focus { outline: none; border-color: var(--accent); }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-success { background: var(--green); color: white; }
    .btn-danger { background: var(--red); color: white; }

    /* ── Loading overlay ── */
    .loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 200;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    .loading-overlay.visible { display: flex; }

    .loading-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 28px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .big-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: var(--accent-light);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    .loading-box p { color: var(--muted); font-size: 13px; }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 18px;
      font-size: 13px;
      z-index: 300;
      transform: translateY(20px);
      opacity: 0;
      transition: all 0.25s;
    }

    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: var(--green); }
    .toast.error { border-color: var(--red-light); }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <span class="logo">Thrudark</span>
    <span class="subtitle">Customer Experience</span>
  </div>
  <div class="nav-divider"></div>
  <div class="stats-bar">
    <div class="stat-pill">
      <span class="label">Open</span>
      <span class="value" id="stat-open">—</span>
    </div>
    <div class="stat-pill urgent">
      <span class="label">Urgent</span>
      <span class="value" id="stat-urgent">—</span>
    </div>
    <div class="stat-pill escalations">
      <span class="label">Escalations</span>
      <span class="value" id="stat-escalations">—</span>
    </div>
    <div class="stat-pill">
      <span class="label">Total</span>
      <span class="value" id="stat-total">—</span>
    </div>
  </div>
</nav>

<div class="app-body">
  <aside>
    <div class="filter-section">
      <h3>Rep</h3>
      <button class="filter-btn active" data-filter="rep" data-value="">All Reps</button>
      <button class="filter-btn" data-filter="rep" data-value="rep1">Sarah</button>
      <button class="filter-btn" data-filter="rep" data-value="rep2">James</button>
    </div>
    <div class="filter-section">
      <h3>Status</h3>
      <button class="filter-btn active" data-filter="status" data-value="">All</button>
      <button class="filter-btn" data-filter="status" data-value="open">Open</button>
      <button class="filter-btn" data-filter="status" data-value="in_progress">In Progress</button>
      <button class="filter-btn" data-filter="status" data-value="resolved">Resolved</button>
    </div>
    <div class="filter-section">
      <h3>Priority</h3>
      <button class="filter-btn active" data-filter="priority" data-value="">All</button>
      <button class="filter-btn" data-filter="priority" data-value="urgent">Urgent</button>
      <button class="filter-btn" data-filter="priority" data-value="high">High</button>
      <button class="filter-btn" data-filter="priority" data-value="medium">Medium</button>
      <button class="filter-btn" data-filter="priority" data-value="low">Low</button>
    </div>
    <div class="filter-section">
      <h3>Actions</h3>
      <button class="process-all-btn" id="process-all-btn">⚡ Process All with AI</button>
    </div>
  </aside>

  <main>
    <div class="ticket-list-panel">
      <div class="list-header">
        <h2>Tickets</h2>
        <span class="ticket-count" id="ticket-count">0 tickets</span>
      </div>
      <div id="ticket-list"></div>
    </div>

    <div class="ticket-detail-panel" id="detail-panel">
      <div class="empty-state">
        <div class="icon">🎫</div>
        <p>Select a ticket to view details</p>
      </div>
    </div>
  </main>
</div>

<div class="loading-overlay" id="loading-overlay">
  <div class="loading-box">
    <div class="big-spinner"></div>
    <p id="loading-text">Processing with AI...</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = '';
  let state = {
    tickets: [],
    selectedId: null,
    filters: { rep: '', status: '', priority: '' }
  };

  // ── Utils ──────────────────────────────────────────────────────────────────

  function timeAgo(dateStr) {
    const diff = Date.now() - new Date(dateStr).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m}m ago`;
    const h = Math.floor(m / 60);
    if (h < 24) return `${h}h ago`;
    return `${Math.floor(h / 24)}d ago`;
  }

  function priorityLabel(p) {
    return p ? p.charAt(0).toUpperCase() + p.slice(1) : '—';
  }

  function categoryLabel(c) {
    if (!c) return null;
    return c.replace(/_/g, ' ');
  }

  function repName(id) {
    return id === 'rep1' ? 'Sarah' : id === 'rep2' ? 'James' : id || 'Unassigned';
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast ${type} show`;
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function showOverlay(text = 'Processing with AI...') {
    document.getElementById('loading-text').textContent = text;
    document.getElementById('loading-overlay').classList.add('visible');
  }

  function hideOverlay() {
    document.getElementById('loading-overlay').classList.remove('visible');
  }

  // ── API calls ──────────────────────────────────────────────────────────────

  async function fetchTickets() {
    const params = new URLSearchParams();
    if (state.filters.rep) params.set('assigned_to', state.filters.rep);
    if (state.filters.status) params.set('status', state.filters.status);
    if (state.filters.priority) params.set('priority', state.filters.priority);
    const res = await fetch(`${API}/api/tickets?${params}`);
    state.tickets = await res.json();
    renderTicketList();
  }

  async function fetchStats() {
    const res = await fetch(`${API}/api/stats`);
    const s = await res.json();
    document.getElementById('stat-open').textContent = s.by_status?.open || 0;
    document.getElementById('stat-urgent').textContent = s.by_priority?.urgent || 0;
    document.getElementById('stat-escalations').textContent = s.escalations || 0;
    document.getElementById('stat-total').textContent = s.total || 0;
  }

  async function processTicket(id) {
    showOverlay('AI is processing this ticket...');
    try {
      const res = await fetch(`${API}/api/tickets/${id}/process`, { method: 'POST' });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.detail || 'Processing failed');
      }
      await res.json();
      await fetchTickets();
      await fetchStats();
      // Re-select the ticket to refresh the detail view
      const updated = state.tickets.find(t => t.id === id);
      if (updated) renderDetail(updated);
      showToast('Ticket processed successfully');
    } catch (e) {
      showToast(e.message, 'error');
    } finally {
      hideOverlay();
    }
  }

  async function processAll() {
    const btn = document.getElementById('process-all-btn');
    btn.disabled = true;
    showOverlay('Processing all tickets with AI...');
    try {
      const res = await fetch(`${API}/api/tickets/process-all`, { method: 'POST' });
      const data = await res.json();
      await fetchTickets();
      await fetchStats();
      showToast(`Processed ${data.processed.length} tickets`);
    } catch (e) {
      showToast('Process all failed: ' + e.message, 'error');
    } finally {
      btn.disabled = false;
      hideOverlay();
    }
  }

  async function updateTicket(id, payload) {
    const res = await fetch(`${API}/api/tickets/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error('Update failed');
    return res.json();
  }

  // ── Render ─────────────────────────────────────────────────────────────────

  function renderTicketList() {
    const list = document.getElementById('ticket-list');
    const count = document.getElementById('ticket-count');
    count.textContent = `${state.tickets.length} ticket${state.tickets.length !== 1 ? 's' : ''}`;

    if (state.tickets.length === 0) {
      list.innerHTML = '<div style="padding:32px;text-align:center;color:var(--muted)">No tickets match filters</div>';
      return;
    }

    list.innerHTML = state.tickets.map(t => {
      const selected = t.id === state.selectedId ? ' selected' : '';
      const cat = categoryLabel(t.category);
      const esc = t.escalation_flag ? '<span class="escalation-icon" title="Escalated">⚠</span>' : '';
      return `
        <div class="ticket-card${selected}" data-id="${t.id}" onclick="selectTicket('${t.id}')">
          <div class="card-top">
            <span class="card-customer">${escHtml(t.customer_name)}</span>
            <div class="card-badges">
              ${esc}
              <span class="badge priority-${t.priority}">${priorityLabel(t.priority)}</span>
            </div>
          </div>
          <div class="card-subject">${escHtml(t.subject)}</div>
          <div class="card-meta">
            <span class="channel-icon">${t.channel === 'email' ? '📧' : '🎫'}</span>
            ${cat ? `<span class="badge category">${cat}</span>` : ''}
            <span>${repName(t.assigned_to)}</span>
            <span style="margin-left:auto">${timeAgo(t.created_at)}</span>
          </div>
        </div>`;
    }).join('');
  }

  function selectTicket(id) {
    state.selectedId = id;
    document.querySelectorAll('.ticket-card').forEach(el => {
      el.classList.toggle('selected', el.dataset.id === id);
    });
    const ticket = state.tickets.find(t => t.id === id);
    if (ticket) renderDetail(ticket);
  }

  function renderDetail(t) {
    const panel = document.getElementById('detail-panel');
    const cat = categoryLabel(t.category);
    const escalationHtml = t.escalation_flag ? `
      <div class="escalation-banner">
        <span class="icon">🚨</span>
        <div>
          <strong>Escalation Required</strong>
          <p>${escHtml(t.escalation_reason || 'This ticket has been flagged for escalation.')}</p>
        </div>
      </div>` : '';

    panel.innerHTML = `
      <div class="detail-header">
        <div class="detail-title">
          <h2>${escHtml(t.subject)}</h2>
          <div class="detail-meta">
            <span class="badge priority-${t.priority}">${priorityLabel(t.priority)}</span>
            <span class="badge status-${t.status}">${t.status.replace('_', ' ')}</span>
            ${cat ? `<span class="badge category">${cat}</span>` : ''}
            <span style="color:var(--muted);font-size:12px">${t.id} · ${timeAgo(t.created_at)}</span>
          </div>
        </div>
        <button class="ai-btn" id="process-btn" onclick="processTicket('${t.id}')">
          <span>⚡</span>
          <span id="process-btn-text">Process with AI</span>
          <div class="spinner" id="process-spinner"></div>
        </button>
      </div>

      ${escalationHtml}

      <div class="card-section">
        <h3>Customer</h3>
        <div class="customer-info">
          <div class="info-field"><label>Name</label><span>${escHtml(t.customer_name)}</span></div>
          <div class="info-field"><label>Email</label><span>${escHtml(t.customer_email)}</span></div>
          <div class="info-field"><label>Channel</label><span>${t.channel === 'email' ? '📧 Email' : '🎫 Ticket'}</span></div>
          <div class="info-field"><label>Assigned to</label><span>${repName(t.assigned_to)}</span></div>
        </div>
      </div>

      <div class="card-section">
        <h3>Message</h3>
        <div class="ticket-body-text">${escHtml(t.body)}</div>
      </div>

      <div class="card-section">
        <h3>Draft Reply</h3>
        <textarea class="draft-reply" id="draft-reply-input" placeholder="Click 'Process with AI' to generate a draft reply...">${escHtml(t.draft_reply || '')}</textarea>
      </div>

      <div class="card-section">
        <h3>Actions</h3>
        <div class="actions-row">
          <select class="status-select" id="status-select">
            <option value="open" ${t.status === 'open' ? 'selected' : ''}>Open</option>
            <option value="in_progress" ${t.status === 'in_progress' ? 'selected' : ''}>In Progress</option>
            <option value="resolved" ${t.status === 'resolved' ? 'selected' : ''}>Resolved</option>
          </select>
          <button class="btn btn-primary" onclick="saveTicketUpdate('${t.id}')">Update</button>
          <button class="btn btn-success" onclick="markResolved('${t.id}')">Mark Resolved</button>
        </div>
      </div>
    `;
  }

  async function saveTicketUpdate(id) {
    const status = document.getElementById('status-select')?.value;
    const draft_reply = document.getElementById('draft-reply-input')?.value;
    try {
      await updateTicket(id, { status, draft_reply });
      await fetchTickets();
      await fetchStats();
      const updated = state.tickets.find(t => t.id === id);
      if (updated) renderDetail(updated);
      showToast('Ticket updated');
    } catch (e) {
      showToast(e.message, 'error');
    }
  }

  async function markResolved(id) {
    try {
      await updateTicket(id, { status: 'resolved' });
      await fetchTickets();
      await fetchStats();
      // Re-render detail with updated ticket
      const updated = state.tickets.find(t => t.id === id);
      if (updated) renderDetail(updated);
      showToast('Ticket resolved');
    } catch (e) {
      showToast(e.message, 'error');
    }
  }

  function escHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ── Filters ────────────────────────────────────────────────────────────────

  document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => {
      const filter = btn.dataset.filter;
      const value = btn.dataset.value;
      state.filters[filter] = value;
      // Update active state for this filter group
      document.querySelectorAll(`.filter-btn[data-filter="${filter}"]`).forEach(b => {
        b.classList.toggle('active', b.dataset.value === value);
      });
      fetchTickets();
    });
  });

  document.getElementById('process-all-btn').addEventListener('click', processAll);

  // ── Init + auto-refresh ────────────────────────────────────────────────────

  async function init() {
    await Promise.all([fetchTickets(), fetchStats()]);
  }

  init();
  setInterval(() => {
    fetchTickets();
    fetchStats();
  }, 30000);
</script>
</body>
</html>
